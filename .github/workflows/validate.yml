name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clientweave
          POSTGRES_PASSWORD: clientweave
          POSTGRES_DB: clientweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clientweave -d clientweave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clientweave:clientweave@127.0.0.1:5432/clientweave
      DIRECT_DATABASE_URL: postgresql://clientweave:clientweave@127.0.0.1:5432/clientweave
      TEST_DATABASE_URL: postgresql://clientweave:clientweave@127.0.0.1:5432/clientweave
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-owner-test-anon-key-000000000000
      SUPABASE_SERVICE_ROLE_KEY: ci-owner-test-service-role-key-000000
      SCOPE_CAPABILITY_PEPPER: ci-scope-capability-pepper-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit migrate
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contract:check
      - run: pnpm test:unit
      - run: pnpm test:property
      - run: pnpm test:integration
      - run: pnpm test:concurrency
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
      - run: PERFORMANCE_PROFILE=ci pnpm exec playwright test tests/e2e/complete-ordinary-journey.spec.ts
      - run: PERFORMANCE_PROFILE=ci pnpm exec playwright test tests/e2e/performance-targets.spec.ts
      - run: pnpm test:webmcp
      - run: pnpm test:security
