openapi: 3.1.0
info:
  title: ClientWeave Public and Agent API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Source contract for the ordinary buyer UI and six page-provided agent
    capabilities. Owner administration uses the same domain services behind
    authenticated server actions and is described by the plan and data model.
servers:
  - url: /api/v1
tags:
  - name: Discovery
    description: Read-only active service discovery.
  - name: Scope
    description: Shared draft creation, review, mutation, events, and inspection.
  - name: Pricing
    description: Deterministic quote derivation and persistence.
  - name: Availability
    description: Read-only native consultation availability.
  - name: Confirmation
    description: Server-authored review and direct human confirmation.
  - name: Finalization
    description: Atomic idempotent lead submission and optional booking.
paths:
  /services:
    get:
      tags: [Discovery]
      operationId: discover_services
      summary: Discover active services matching a buyer need
      security: []
      x-agent-capability:
        stateEffect: READ_ONLY
        consequential: false
      parameters:
        - in: query
          name: need
          required: true
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - in: query
          name: budgetMaxMinor
          schema: { type: integer, minimum: 0 }
        - in: query
          name: desiredDeliveryDate
          schema: { type: string, format: date }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: Matching active services
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceMatch' }
                additionalProperties: false
        '429': { $ref: '#/components/responses/RateLimited' }
  /scopes:
    post:
      tags: [Scope]
      operationId: create_scope
      summary: Create one durable shared draft scope
      security: []
      x-agent-capability:
        stateEffect: DRAFT_MUTATION
        consequential: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScopeRequest' }
      responses:
        '201':
          description: Scope created; continuationUrl contains a one-time bearer token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScopeReview'
                  - type: object
                    required: [continuationUrl]
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /scopes/current:
    get:
      tags: [Scope]
      operationId: get_current_scope
      summary: Read the one scope authorized by the bearer token
      security: [{ scopeBearer: [] }]
      responses:
        '200':
          description: Current review model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeReview' }
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
    patch:
      tags: [Scope]
      operationId: update_scope
      summary: Apply validated changes to the shared draft
      security: [{ scopeBearer: [] }]
      x-agent-capability:
        stateEffect: DRAFT_MUTATION
        consequential: false
      parameters:
        - in: header
          name: If-Match
          required: true
          description: Quoted last-seen scope revision, for example `"7"`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateScopeRequest' }
      responses:
        '200':
          description: Updated scope and validation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeReview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /scopes/current/quotes:
    post:
      tags: [Pricing]
      operationId: price_scope
      summary: Deterministically price the current normalized scope
      security: [{ scopeBearer: [] }]
      x-agent-capability:
        stateEffect: DERIVED_RECORD_WRITE
        consequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Quote result; eligibility is false when information is missing or conflicted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResult' }
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /scopes/current/availability:
    get:
      tags: [Availability]
      operationId: find_consultation_slots
      summary: List currently bookable consultation slots
      security: [{ scopeBearer: [] }]
      x-agent-capability:
        stateEffect: READ_ONLY
        consequential: false
      parameters:
        - in: query
          name: after
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: Available slots; listing does not reserve them
          content:
            application/json:
              schema:
                type: object
                required: [timezone, slots]
                properties:
                  timezone: { type: string, example: America/New_York }
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilitySlot' }
                additionalProperties: false
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
  /scopes/current/final-summary:
    post:
      tags: [Confirmation]
      operationId: create_final_summary
      summary: Build the exact server-authored summary a human must review
      security: [{ scopeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizationSelection' }
      responses:
        '200':
          description: Display-ready summary and short-lived nonce
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalSummary' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /scopes/current/human-confirmations:
    post:
      tags: [Confirmation]
      operationId: record_human_confirmation
      summary: Record a direct human confirmation of the current final summary
      description: This operation is intentionally not registered as an agent capability.
      security: [{ scopeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summaryNonce]
              properties:
                summaryNonce: { type: string, minLength: 32, maxLength: 512 }
              additionalProperties: false
      responses:
        '201':
          description: Current human confirmation
          content:
            application/json:
              schema:
                type: object
                required: [confirmationId, confirmedAt]
                properties:
                  confirmationId: { type: string, format: uuid }
                  confirmedAt: { type: string, format: date-time }
                additionalProperties: false
        '403': { $ref: '#/components/responses/HumanGestureRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
  /scopes/current/finalizations:
    post:
      tags: [Finalization]
      operationId: finalize_confirmed_scope
      summary: Create the single lead and optional booking from a current confirmation
      security: [{ scopeBearer: [] }]
      x-agent-capability:
        stateEffect: CONSEQUENTIAL_WRITE
        consequential: true
        requiresCurrentHumanConfirmation: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationId]
              properties:
                confirmationId: { type: string, format: uuid }
              additionalProperties: false
      responses:
        '200':
          description: Existing result returned for a successful retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationResult' }
        '201':
          description: Lead and optional booking created atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationResult' }
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /scopes/current/events:
    get:
      tags: [Scope]
      operationId: stream_scope_events
      summary: Stream revision notifications for the authorized scope
      security: [{ scopeBearer: [] }]
      responses:
        '200':
          description: Server-sent events containing IDs and revisions, never secrets or full contact data
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
  /scopes/current/inspector:
    get:
      tags: [Scope]
      operationId: get_scope_tool_inspector
      summary: Read capability definitions and sanitized recent outcomes for this scope
      security: [{ scopeBearer: [] }]
      responses:
        '200':
          description: Safe inspector model
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, recentInvocations]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: '#/components/schemas/CapabilitySummary' }
                  recentInvocations:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/InvocationSummary' }
                additionalProperties: false
        '404': { $ref: '#/components/responses/ScopeUnavailable' }
components:
  securitySchemes:
    scopeBearer:
      type: http
      scheme: bearer
      bearerFormat: OpaqueScopeToken
      description: High-entropy token authorizing only one unexpired scope; stored hashed server-side.
  parameters:
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    ValidationError:
      description: Input or current-state validation failed safely
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Revision, quote, confirmation, idempotency, or slot conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ScopeUnavailable:
      description: Scope credential is invalid, expired, revoked, or does not authorize this resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PreconditionFailed:
      description: The supplied scope revision is stale
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PreconditionRequired:
      description: A required revision precondition is missing
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    HumanGestureRequired:
      description: Confirmation did not originate from the trusted human UI boundary
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: Public request limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    MoneyRange:
      type: object
      required: [currency, minMinor, maxMinor]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        minMinor: { type: integer, minimum: 0 }
        maxMinor: { type: integer, minimum: 0 }
      additionalProperties: false
    ServiceMatch:
      type: object
      required: [serviceId, slug, name, description, basePrice, deliveryBusinessDays, includedItems, intakeFields, fit]
      properties:
        serviceId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        basePrice: { $ref: '#/components/schemas/MoneyRange' }
        deliveryBusinessDays:
          type: object
          required: [min, max]
          properties:
            min: { type: integer, minimum: 1 }
            max: { type: integer, minimum: 1 }
          additionalProperties: false
        includedItems: { type: array, items: { type: string } }
        addOns: { type: array, items: { type: string } }
        intakeFields:
          type: array
          items: { $ref: '#/components/schemas/ScopeField' }
        fit:
          type: object
          required: [eligible, reasons, conflicts]
          properties:
            eligible: { type: boolean }
            reasons: { type: array, items: { type: string } }
            conflicts: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
          additionalProperties: false
      additionalProperties: false
    ScopeField:
      type: object
      required: [key, label, valueType, required, priceAffecting]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string }
        helpText: { type: string }
        valueType: { enum: [TEXT, INTEGER, DECIMAL, BOOLEAN, DATE, SINGLE_CHOICE, MULTI_CHOICE] }
        required: { type: boolean }
        priceAffecting: { type: boolean }
        allowedValues: { type: array, items: { type: [string, number, boolean] } }
      additionalProperties: false
    CreateScopeRequest:
      type: object
      required: [serviceId, goal]
      properties:
        serviceId: { type: string, format: uuid }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        budgetMaxMinor: { type: integer, minimum: 0 }
        targetDeliveryDate: { type: string, format: date }
        answers:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AnswerInput' }
      additionalProperties: false
    UpdateScopeRequest:
      type: object
      required: [expectedRevision, changes]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        changes:
          type: object
          properties:
            goal: { type: string, minLength: 1, maxLength: 2000 }
            budgetMaxMinor: { type: [integer, 'null'], minimum: 0 }
            targetDeliveryDate: { type: [string, 'null'], format: date }
            answers:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/AnswerInput' }
          additionalProperties: false
      additionalProperties: false
    AnswerInput:
      type: object
      required: [fieldKey, value]
      properties:
        fieldKey: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        value: {}
      additionalProperties: false
    ScopeReview:
      type: object
      required: [scopeRef, status, revision, service, goal, answers, missingFields, conflicts, quoteStatus, expiresAt]
      properties:
        scopeRef: { type: string, minLength: 16, maxLength: 128 }
        status: { enum: [DRAFT, FINALIZED, EXPIRED] }
        revision: { type: integer, minimum: 1 }
        service: { $ref: '#/components/schemas/ServiceMatch' }
        goal: { type: string }
        budgetMaxMinor: { type: [integer, 'null'], minimum: 0 }
        targetDeliveryDate: { type: [string, 'null'], format: date }
        answers:
          type: array
          items:
            type: object
            required: [fieldKey, value, provenance, updatedAt]
            properties:
              fieldKey: { type: string }
              value: {}
              provenance: { enum: [HUMAN, AGENT, IMPORTED, SYSTEM] }
              updatedAt: { type: string, format: date-time }
            additionalProperties: false
        missingFields: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        quoteStatus: { enum: [NONE, CURRENT, STALE, INCOMPLETE, CONFLICTED] }
        expiresAt: { type: string, format: date-time }
        continuationUrl:
          type: string
          format: uri
          description: Returned only once from scope creation; its secret is in the URL fragment.
      additionalProperties: false
    ValidationIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        fieldKey: { type: string }
        message: { type: string }
        severity: { enum: [INFO, WARNING, ERROR], default: ERROR }
        suggestedActions: { type: array, items: { type: string } }
      additionalProperties: false
    QuoteResult:
      type: object
      required: [eligible, scopeRevision, ruleSetVersion, missingFields, conflicts, assumptions]
      properties:
        eligible: { type: boolean }
        quoteId: { type: string, format: uuid }
        scopeRevision: { type: integer, minimum: 1 }
        ruleSetVersion: { type: integer, minimum: 1 }
        total: { $ref: '#/components/schemas/MoneyRange' }
        lineItems:
          type: array
          items:
            type: object
            required: [ruleId, label, minAdjustmentMinor, maxAdjustmentMinor]
            properties:
              ruleId: { type: string, format: uuid }
              label: { type: string }
              minAdjustmentMinor: { type: integer }
              maxAdjustmentMinor: { type: integer }
            additionalProperties: false
        assumptions: { type: array, items: { type: string } }
        missingFields: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        calculatedAt: { type: string, format: date-time }
      additionalProperties: false
    AvailabilitySlot:
      type: object
      required: [slotId, startsAt, endsAt, timezone]
      properties:
        slotId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
      additionalProperties: false
    FinalizationSelection:
      type: object
      required: [expectedRevision, quoteId, action, contact]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        quoteId: { type: string, format: uuid }
        action: { enum: [SUBMIT_LEAD, SUBMIT_LEAD_AND_BOOK] }
        slotId: { type: string, format: uuid }
        contact:
          type: object
          required: [name, email]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            email: { type: string, format: email, maxLength: 254 }
          additionalProperties: false
      additionalProperties: false
    FinalSummary:
      type: object
      required: [summaryNonce, scopeRevision, quote, action, contact, notices, expiresAt]
      properties:
        summaryNonce: { type: string }
        scopeRevision: { type: integer }
        quote: { $ref: '#/components/schemas/QuoteResult' }
        action: { enum: [SUBMIT_LEAD, SUBMIT_LEAD_AND_BOOK] }
        contact: { type: object }
        slot: { $ref: '#/components/schemas/AvailabilitySlot' }
        notices: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false
    FinalizationResult:
      type: object
      required: [scopeRef, leadId, status, finalizedAt]
      properties:
        scopeRef: { type: string, minLength: 16, maxLength: 128 }
        leadId: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        status: { enum: [FINALIZED] }
        finalizedAt: { type: string, format: date-time }
      additionalProperties: false
    CapabilitySummary:
      type: object
      required: [name, stateEffect, consequential, description]
      properties:
        name: { enum: [discover_services, create_scope, update_scope, price_scope, find_consultation_slots, finalize_confirmed_scope] }
        stateEffect: { enum: [READ_ONLY, DRAFT_MUTATION, DERIVED_RECORD_WRITE, CONSEQUENTIAL_WRITE] }
        consequential: { type: boolean }
        description: { type: string }
      additionalProperties: false
    InvocationSummary:
      type: object
      required: [capability, stateEffect, outcome, occurredAt]
      properties:
        capability: { type: string }
        stateEffect: { type: string }
        outcome: { enum: [SUCCEEDED, REJECTED, FAILED] }
        reasonCode: { type: string }
        durationMs: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
      additionalProperties: false
    ProblemDetails:
      type: object
      required: [type, title, status, detail, code, retryable, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        retryable: { type: boolean }
        fieldErrors: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        currentRevision: { type: integer, minimum: 1 }
        traceId: { type: string }
